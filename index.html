```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lunara</title>

    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5eee6;
            color: #5c4640;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 230px;
            height: 100vh;

            background: #d99a8c;

            padding: 35px 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;

            color: #fffaf6;

            margin-bottom: 50px;

            letter-spacing: -0.5px;
        }

        .menu {
            display: block;

            color: #fffaf6;

            text-decoration: none;

            font-size: 17px;

            font-weight: 800;

            padding: 15px 16px;

            margin-bottom: 12px;

            border-radius: 10px;

            transition: all 0.2s ease;
        }

        .menu:hover {
            background: #c98274;

            transform: translateX(4px);
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 230px;

            padding: 50px;

            padding-bottom: 130px;
        }

        h1 {
            color: #b86f63;

            font-size: 40px;

            font-weight: 800;

            margin-bottom: 10px;
        }

        .subtitle {
            color: #80645d;

            font-size: 16px;

            margin-top: 0;
        }

        .section-title {
            margin-top: 50px;

            font-size: 25px;

            font-weight: 800;

            color: #5c4640;
        }


        /* =========================
           ALBUM
        ========================= */

        .album {
            display: inline-block;

            width: 240px;

            background: #fffaf6;

            padding: 18px;

            border-radius: 12px;

            margin-top: 15px;

            box-shadow:
                0 5px 15px rgba(120, 80, 70, 0.12);

            transition: 0.25s;
        }

        .album:hover {
            transform: translateY(-5px);

            box-shadow:
                0 10px 25px rgba(120, 80, 70, 0.18);
        }

        .album-cover {
            width: 204px;
            height: 204px;

            background: linear-gradient(
                135deg,
                #e8b2a6,
                #c98274
            );

            border-radius: 8px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-size: 48px;
        }

        .album h2 {
            margin-top: 17px;

            margin-bottom: 6px;

            color: #5c4640;

            font-size: 19px;

            font-weight: 700;
        }

        .album p {
            color: #94756d;

            font-size: 14px;

            margin-top: 0;

            margin-bottom: 18px;
        }


        /* =========================
           BUTTON
        ========================= */

        button {
            background: #d99a8c;

            color: white;

            border: none;

            padding: 11px 22px;

            border-radius: 30px;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #c98274;

            transform: scale(1.04);
        }


        /* =========================
           MUSIC PLAYER
        ========================= */

        .player {
            position: fixed;

            bottom: 0;

            left: 230px;

            right: 0;

            height: 90px;

            background: #fffaf6;

            border-top: 1px solid #e3b5aa;

            display: flex;

            align-items: center;

            padding: 15px 30px;

            gap: 20px;

            box-shadow:
                0 -3px 15px rgba(120, 80, 70, 0.08);
        }

        .song-info {
            flex: 1;
        }

        .song-title {
            font-size: 15px;

            font-weight: 800;

            color: #5c4640;
        }

        .artist {
            color: #94756d;

            font-size: 13px;

            margin-top: 5px;
        }

        .player button {
            width: 45px;

            height: 45px;

            padding: 0;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .sidebar {
                position: relative;

                width: 100%;

                height: auto;

                padding: 20px;
            }

            .logo {
                margin-bottom: 25px;
            }

            .menu {
                display: inline-block;

                margin-right: 5px;

                margin-bottom: 5px;
            }

            .main {
                margin-left: 0;

                padding: 30px 20px 120px;
            }

            h1 {
                font-size: 30px;
            }

            .player {
                left: 0;

                height: 80px;

                padding: 12px 20px;
            }

        }

    </style>
</head>


<body>


    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            Lunara
        </div>

        <a class="menu" href="#">
            Home
        </a>

        <a class="menu" href="#">
            Search
        </a>

        <a class="menu" href="#">
            Liked Songs
        </a>

        <a class="menu" href="#">
            Playlists
        </a>

    </div>


    <!-- MAIN CONTENT -->

    <div class="main">

        <h1>
            Welcome to Lunara
        </h1>

        <p class="subtitle">
            Your favorite music, all in one place.
        </p>


        <h2 class="section-title">
            Made for you
        </h2>


        <!-- ALBUM -->

        <div class="album">

            <div class="album-cover">
                MUSIC
            </div>

            <h2>
                Pink Dreams
            </h2>

            <p>
                My First Album
            </p>

            <button onclick="playSong()">
                Play
            </button>

        </div>

    </div>


    <!-- MUSIC PLAYER -->

    <div class="player">

        <div class="song-info">

            <div class="song-title">
                Pink Dreams
            </div>

            <div class="artist">
                Lunara Artist
            </div>

        </div>

        <button
            onclick="playSong()"
            id="playButton"
        >
            Play
        </button>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        let playing = false;

        function playSong() {

            playing = !playing;

            const button =
                document.getElementById("playButton");

            if (playing) {

                button.innerHTML = "Pause";

            } else {

                button.innerHTML = "Play";

            }

        }

    </script>


</body>
</html>
```
